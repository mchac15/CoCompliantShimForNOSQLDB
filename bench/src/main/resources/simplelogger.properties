org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=true
# expected in --parallel-branches: a failed branch reports PhaseOne_Failed after the global rollback removed it
org.slf4j.simpleLogger.log.org.apache.seata.rm.datasource.xa.ConnectionProxyXA=error
# the TC broadcasts AT-mode undo-log cleanups to every resource; ours are XA and have none
org.slf4j.simpleLogger.log.org.apache.seata.rm.RMHandlerAT=error
